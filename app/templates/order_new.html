{% extends "base.html" %}
{% block title %}New order - ClearSettle{% endblock %}
{% block content %}
<div class="page-head">
  <h1>New order</h1>
  <p>Enter the buyer and item details. Payment comes after the buyer reads and accepts the policy explanation.</p>
</div>
<div class="card">
  <form method="post">
    <label>Buyer name
      <input type="text" name="buyer_name" maxlength="100" required>
    </label>
    <label>Buyer email
      <input type="email" name="buyer_email" required>
    </label>
    <label>Item description
      <input type="text" name="description" maxlength="200" required>
    </label>
    <label>Amount (USD)
      <input type="number" name="amount" step="0.01" min="0.01" max="10000" required>
    </label>
    <button type="submit" class="btn-primary">Create order</button>
    <a class="btn" href="{{ url_for('orders.index') }}">Cancel</a>
  </form>
</div>
{% endblock %}
