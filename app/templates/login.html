{% extends "base.html" %}
{% block title %}Log in - ClearSettle{% endblock %}
{% block content %}
<h1>Merchant login</h1>
<form method="post">
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>
<p>No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
