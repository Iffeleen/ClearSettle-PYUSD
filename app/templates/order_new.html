{% extends "base.html" %}
{% block title %}New order - ClearSettle{% endblock %}
{% block content %}
<h1>New order</h1>
<form method="post">
  <label>Buyer name
    <input type="text" name="buyer_name" maxlength="100" required>
  </label>
  <label>Buyer email
    <input type="email" name="buyer_email" required>
  </label>
  <label>Item description
    <input type="text" name="description" maxlength="200" required>
  </label>
  <label>Amount (USD)
    <input type="number" name="amount" step="0.01" min="0.01" max="10000" required>
  </label>
  <button type="submit">Create order</button>
</form>
<p><a href="{{ url_for('orders.index') }}">Back to orders</a></p>
{% endblock %}
