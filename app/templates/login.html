{% extends "auth_base.html" %}
{% block title %}Log in - ClearSettle{% endblock %}
{% block content %}
<h1>Merchant login</h1>
<p class="muted">Welcome back. Log in to manage your orders.</p>
<form method="post">
  <label>Username or email
    <input type="text" name="email" required autofocus autocapitalize="none">
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit" class="btn-primary">Log in</button>
  <a class="btn" href="{{ url_for('auth.register') }}">Create account</a>
</form>
{% endblock %}
